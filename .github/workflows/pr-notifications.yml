name: PR Notifications

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  pull_request_review:
    types: [submitted]

jobs:
  notify:
    name: Send PR notification to Telegram
    runs-on: ubuntu-latest
    steps:
      - name: Send PR notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_AUTHOR="${{ github.event.pull_request.user.login }}"
          PR_URL="${{ github.event.pull_request.html_url }}"
          PR_STATE="${{ github.event.pull_request.state }}"
          ACTION="${{ github.event.action }}"
          REVIEWER="${{ github.event.review.user.login }}"

          if [ "$ACTION" == "opened" ]; then
            EVENT_TYPE="🆕 Новый PR"
          elif [ "$ACTION" == "reopened" ]; then
            EVENT_TYPE="🔄 PR переоткрыт"
          elif [ "$ACTION" == "ready_for_review" ]; then
            EVENT_TYPE="✅ PR готов к ревью"
          elif [ "$ACTION" == "submitted" ]; then
            REVIEW_STATE="${{ github.event.review.state }}"
            if [ "$REVIEW_STATE" == "approved" ]; then
              EVENT_TYPE="✅ PR одобрен"
              REVIEWER_INFO="*Одобрил:* @${REVIEWER}"
            elif [ "$REVIEW_STATE" == "changes_requested" ]; then
              EVENT_TYPE="🔧 Требуются изменения"
              REVIEWER_INFO="*Ревьюер:* @${REVIEWER}"
            else
              EVENT_TYPE="💬 Оставлен комментарий"
              REVIEWER_INFO="*Ревьюер:* @${REVIEWER}"
            fi
          else
            EVENT_TYPE="📝 Обновление PR"
          fi

          MESSAGE="${EVENT_TYPE}

          *PR #${PR_NUMBER}:* ${PR_TITLE}
          *Автор:* @${PR_AUTHOR}
          *Статус:* ${PR_STATE}"

          if [ -n "$REVIEWER_INFO" ]; then
            MESSAGE="${MESSAGE}
          ${REVIEWER_INFO}"
          fi

          MESSAGE="${MESSAGE}

          [Открыть PR](${PR_URL})"

          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d message_thread_id="20" \
              -d text="${MESSAGE}" \
              -d parse_mode="Markdown" \
              -d disable_web_page_preview="true"
          else
            echo "Telegram credentials not configured. Skipping notification."
          fi
